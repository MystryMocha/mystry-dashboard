changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: Features / 新功能
      labels:
        - enhancement
        - feature
    - title: Fixes / 修复
      labels:
        - bug
        - fix
    - title: Security / 安全
      labels:
        - security
    - title: Other Changes / 其他变更
      labels:
        - "*"
