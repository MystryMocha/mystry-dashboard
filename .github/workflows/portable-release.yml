# Third-party Actions pinned by SHA: see .github/actions-pins.md (reviewed 2026-08-07)
name: Portable Preview Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: An existing version tag that is in the history of main
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: portable-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Pre-release gate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      tag: ${{ steps.release-tag.outputs.tag }}

    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate tag and main ancestry
        id: release-tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" == v* ]] || {
            echo "::error::The version tag must start with v"
            exit 1
          }
          TAG_COMMIT="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$TAG_COMMIT" origin/main || {
            echo "::error::The tag commit is not in the history of origin/main"
            exit 1
          }
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          [[ "${RELEASE_TAG#v}" == "$PACKAGE_VERSION" ]] || {
            echo "::error::Tag $RELEASE_TAG does not match package.json version $PACKAGE_VERSION"
            exit 1
          }
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Assert clean worktree at tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "::error::The working tree of the tag checkout must be clean"
            git status --short
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify project
        run: npm run verify

      - name: Audit production dependencies
        run: npm run audit:production

  build:
    name: ${{ matrix.label }}
    needs: prepare
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            os: windows-2025
            platform: win32
            arch: x64
            asset_suffix: windows-x64.zip
          - label: Linux x64
            os: ubuntu-24.04
            platform: linux
            arch: x64
            asset_suffix: linux-x64.tar.gz

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Windows-specific tests
        if: matrix.platform == 'win32'
        run: npm run windows:test

      - name: Build application
        run: npm run build

      - name: Verify portable tooling
        run: npm run portable:test

      - name: Assemble portable archive
        run: >-
          node scripts/portable/package-portable.mjs
          --platform ${{ matrix.platform }}
          --arch ${{ matrix.arch }}
          --output-dir release

      - name: Smoke test final archive
        run: >-
          node scripts/portable/smoke-portable.mjs
          "release/mystry-${{ needs.prepare.outputs.tag }}-${{ matrix.asset_suffix }}"

      - name: Upload portable archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: portable-${{ matrix.platform }}-${{ matrix.arch }}
          path: release/mystry-${{ needs.prepare.outputs.tag }}-${{ matrix.asset_suffix }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish Preview
    needs:
      - prepare
      - build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    environment: release

    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.1

      - name: Download all archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: portable-*
          path: release-assets
          merge-multiple: true

      - name: Generate CycloneDX SBOM
        run: node scripts/portable/create-sbom.mjs --output release-assets/sbom.cdx.json

      - name: Generate SHA-256 checksums
        run: node scripts/portable/create-checksums.mjs release-assets

      - name: Sign checksums
        shell: bash
        env:
          RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
          RELEASE_GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
          RELEASE_GPG_FINGERPRINT: ${{ secrets.RELEASE_GPG_FINGERPRINT }}
        run: |
          set -euo pipefail
          normalize_fp() {
            echo "$1" | tr -d '[:space:]' | tr '[:lower:]' '[:upper:]'
          }
          [[ -n "${RELEASE_GPG_PRIVATE_KEY:-}" ]] || {
            echo "::error::RELEASE_GPG_PRIVATE_KEY is missing; refusing to publish unsigned checksums"
            exit 1
          }
          EXPECTED_FP="$(normalize_fp "${RELEASE_GPG_FINGERPRINT:-}")"
          [[ -n "$EXPECTED_FP" ]] || {
            echo "::error::RELEASE_GPG_FINGERPRINT is missing; refusing to publish without a bound signing identity"
            exit 1
          }
          REPO_FP_FILE=".github/release-signing-key.fingerprint"
          [[ -f "$REPO_FP_FILE" ]] || {
            echo "::error::The repo public key fingerprint file is missing: $REPO_FP_FILE"
            exit 1
          }
          REPO_FP="$(normalize_fp "$(grep -v '^#' "$REPO_FP_FILE" | head -n1)")"
          [[ "$REPO_FP" != UNCONFIGURED ]] || {
            echo "::error::The repo release fingerprint is not configured yet; see .github/RELEASE_SIGNING.md"
            exit 1
          }
          [[ "$EXPECTED_FP" == "$REPO_FP" ]] || {
            echo "::error::Environment RELEASE_GPG_FINGERPRINT does not match the repo fingerprint"
            exit 1
          }
          PUB_KEY=".github/release-signing-key.asc"
          grep -q '^-----BEGIN PGP PUBLIC KEY BLOCK-----' "$PUB_KEY" || {
            echo "::error::The repo has no valid ASCII-armored release public key: $PUB_KEY"
            exit 1
          }
          printf '%s' "$RELEASE_GPG_PRIVATE_KEY" | gpg --batch --import
          SECRET_FP="$(gpg --batch --with-colons --list-secret-keys | awk -F: '/^fpr:/ {print $10; exit}')"
          SECRET_FP="$(normalize_fp "$SECRET_FP")"
          [[ "$SECRET_FP" == "$EXPECTED_FP" ]] || {
            echo "::error::The fingerprint of the imported signing private key does not match RELEASE_GPG_FINGERPRINT"
            exit 1
          }
          if [[ -n "${RELEASE_GPG_PASSPHRASE:-}" ]]; then
            printf '%s' "$RELEASE_GPG_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback \
              --passphrase-fd 0 \
              --local-user "$EXPECTED_FP" \
              --armor --detach-sign \
              --output release-assets/SHA256SUMS.asc \
              release-assets/SHA256SUMS
          else
            gpg --batch --yes \
              --local-user "$EXPECTED_FP" \
              --armor --detach-sign \
              --output release-assets/SHA256SUMS.asc \
              release-assets/SHA256SUMS
          fi
          cp "$PUB_KEY" release-assets/mystry-release-signing-key.asc

      - name: Verify checksum signature in isolated keyring
        shell: bash
        env:
          RELEASE_GPG_FINGERPRINT: ${{ secrets.RELEASE_GPG_FINGERPRINT }}
        run: |
          set -euo pipefail
          normalize_fp() {
            echo "$1" | tr -d '[:space:]' | tr '[:lower:]' '[:upper:]'
          }
          EXPECTED_FP="$(normalize_fp "${RELEASE_GPG_FINGERPRINT:-}")"
          VERIFY_HOME="$(mktemp -d)"
          chmod 700 "$VERIFY_HOME"
          gpg --homedir "$VERIFY_HOME" --batch --import .github/release-signing-key.asc
          PUB_FP="$(gpg --homedir "$VERIFY_HOME" --batch --with-colons --list-keys | awk -F: '/^fpr:/ {print $10; exit}')"
          PUB_FP="$(normalize_fp "$PUB_FP")"
          [[ "$PUB_FP" == "$EXPECTED_FP" ]] || {
            echo "::error::The public key fingerprint in the standalone keyring does not match RELEASE_GPG_FINGERPRINT"
            exit 1
          }
          gpg --homedir "$VERIFY_HOME" --batch --verify release-assets/SHA256SUMS.asc release-assets/SHA256SUMS

      - name: Verify release asset set
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.prepare.outputs.tag }}"
          test -f "release-assets/mystry-${VERSION}-windows-x64.zip"
          test -f "release-assets/mystry-${VERSION}-linux-x64.tar.gz"
          test -f release-assets/SHA256SUMS
          test -f release-assets/SHA256SUMS.asc
          test -f release-assets/sbom.cdx.json
          test -f release-assets/mystry-release-signing-key.asc

      # Not --prerelease: GitHub never treats a prerelease as Latest, so the repository home
      # page and /releases/latest would offer no download. Not --latest either: rerunning an
      # older tag would then demote the newest release. Not --generate-notes: it appends a list
      # of pull request titles after the notes, which repeats them in terms users cannot read.
      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" release-assets/* \
            --verify-tag \
            --notes "$(cat .github/portable-preview-notes.md)" \
            --title "$RELEASE_TAG"
