<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <title>Mystry Dashboard</title>
    <script>
      // 渲染前确定外观与强调色，避免闪烁。
      // 优先读取 mystry_appearance / mystry_accent；没有时迁移旧版 mystry_theme 六主题；
      // 都没有则外观跟随系统、强调色为蓝色。
      (function () {
        var root = document.documentElement;
        var appearance = 'auto';
        var accent = 'blue';
        try {
          var legacy = {
            dark: ['dark', 'pink'],
            light: ['light', 'pink'],
            codex: ['dark', 'green'],
            'codex-light': ['light', 'green'],
            grok: ['dark', 'graphite'],
            'grok-light': ['light', 'graphite']
          }[localStorage.getItem('mystry_theme')];
          if (legacy) {
            appearance = legacy[0];
            accent = legacy[1];
          }
          var savedAppearance = localStorage.getItem('mystry_appearance');
          var savedAccent = localStorage.getItem('mystry_accent');
          if (savedAppearance === 'auto' || savedAppearance === 'light' || savedAppearance === 'dark') {
            appearance = savedAppearance;
          }
          if (/^(blue|purple|pink|green|graphite)$/.test(savedAccent || '')) accent = savedAccent;
        } catch (e) {}
        var dark = appearance === 'dark';
        if (appearance === 'auto') {
          try {
            dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          } catch (e) {}
        }
        root.dataset.appearancePreference = appearance;
        root.dataset.appearance = dark ? 'dark' : 'light';
        root.dataset.accent = accent;
      })();
      // 渲染前确定界面语言并写入 <html lang>，规则与 src/i18n/locale.ts 的 detectLocale 一致：
      // 读取 mystry_locale（auto / en / zh-CN / zh-TW），自动时按浏览器语言列表取第一个 zh* 或 en*：
      // 繁体（Hant，或未写 Hans 且地区为 TW/HK/MO）用繁體中文，其他 zh* 用简体中文，en* 或都没有用英文。
      (function () {
        var root = document.documentElement;
        var preference = 'auto';
        try {
          var saved = localStorage.getItem('mystry_locale');
          if (saved === 'auto' || saved === 'en' || saved === 'zh-CN' || saved === 'zh-TW') preference = saved;
        } catch (e) {}
        var locale = preference;
        if (preference === 'auto') {
          locale = 'en';
          var languages = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || ''];
          for (var i = 0; i < languages.length; i++) {
            var tag = String(languages[i]).toLowerCase();
            if (tag.indexOf('zh') === 0) {
              var traditional = /(^|-)hant(-|$)/.test(tag)
                || (!/(^|-)hans(-|$)/.test(tag) && /(^|-)(tw|hk|mo)(-|$)/.test(tag));
              locale = traditional ? 'zh-TW' : 'zh-CN';
              break;
            }
            if (tag.indexOf('en') === 0) { locale = 'en'; break; }
          }
        }
        root.dataset.localePreference = preference;
        root.lang = locale;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
