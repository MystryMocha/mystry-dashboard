<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1e1e20" media="(prefers-color-scheme: dark)" />
    <title>Mystry Dashboard</title>
    <script>
      // Decide the appearance before rendering, to avoid a flash. The accent color is fixed to clay orange, and mystry_accent is no longer read.
      // mystry_appearance is read first; without it the appearance is migrated from the six themes of the legacy mystry_theme; with neither, follow the system.
      (function () {
        var root = document.documentElement;
        var appearance = 'auto';
        try {
          var legacy = {
            dark: 'dark',
            light: 'light',
            codex: 'dark',
            'codex-light': 'light',
            grok: 'dark',
            'grok-light': 'light'
          }[localStorage.getItem('mystry_theme')];
          if (legacy) appearance = legacy;
          var savedAppearance = localStorage.getItem('mystry_appearance');
          if (savedAppearance === 'auto' || savedAppearance === 'light' || savedAppearance === 'dark') {
            appearance = savedAppearance;
          }
        } catch (e) {}
        var dark = appearance === 'dark';
        if (appearance === 'auto') {
          try {
            dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          } catch (e) {}
        }
        root.dataset.appearancePreference = appearance;
        root.dataset.appearance = dark ? 'dark' : 'light';
      })();
      // Decide the UI language before rendering and write it to <html lang>, with the same rules as detectLocale in src/i18n/locale.ts:
      // read mystry_locale (auto / en / zh-CN / zh-TW), and for auto take the first zh* or en* from the browser's language list:
      // Traditional (Hant, or a region of TW/HK/MO when Hans is not written) uses Traditional Chinese, other zh* use Simplified Chinese, and en* or neither uses English.
      (function () {
        var root = document.documentElement;
        var preference = 'auto';
        try {
          var saved = localStorage.getItem('mystry_locale');
          if (saved === 'auto' || saved === 'en' || saved === 'zh-CN' || saved === 'zh-TW') preference = saved;
        } catch (e) {}
        var locale = preference;
        if (preference === 'auto') {
          locale = 'en';
          var languages = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || ''];
          for (var i = 0; i < languages.length; i++) {
            var tag = String(languages[i]).toLowerCase();
            if (tag.indexOf('zh') === 0) {
              var traditional = /(^|-)hant(-|$)/.test(tag)
                || (!/(^|-)hans(-|$)/.test(tag) && /(^|-)(tw|hk|mo)(-|$)/.test(tag));
              locale = traditional ? 'zh-TW' : 'zh-CN';
              break;
            }
            if (tag.indexOf('en') === 0) { locale = 'en'; break; }
          }
        }
        root.dataset.localePreference = preference;
        root.lang = locale;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
